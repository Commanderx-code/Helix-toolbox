name = "Fallback Sample"
description = "A package no distribution has, with a Flathub fallback. The tests run it against stand-in package managers."
flags = "I"

[package]
binary = "helix-toolbox-fallback-sample"
arch = "helix-toolbox-no-such-package"
debian = "helix-toolbox-no-such-package"
fedora = "helix-toolbox-no-such-package"
suse = "helix-toolbox-no-such-package"
flatpak = "org.helixtoolbox.FallbackSample"
removable = true
