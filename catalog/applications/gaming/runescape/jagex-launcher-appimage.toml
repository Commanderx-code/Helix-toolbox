name = "Jagex Launcher (AppImage)"
description = "Jagex's official Linux launcher, a beta AppImage that plays Old School RuneScape through RuneLite (RuneScape later), downloaded from Jagex to ~/.local/share/helixforge/appimages with a jagex-launcher command and a menu entry. Installs fuse3 first if AppImages cannot start. Run it again to update."
flags = "FM"
order = 103

[script]
id = "commander/jagex-launcher-appimage"

# What the script installs, so its status can be shown.
[detect]
binary = "jagex-launcher"

[needs]
# The launcher is built for x86_64 only, and its installer refuses others.
architectures = ["x86_64"]
