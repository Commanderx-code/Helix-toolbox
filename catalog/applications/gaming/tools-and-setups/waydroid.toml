name = "Waydroid"
description = "Waydroid is an emulator that allows you to run Android apps and games on Linux."
flags = "I SS"
order = 111

[[preconditions]]
matches = true
check = { environment = "XDG_SESSION_TYPE" }
values = ["wayland", "Wayland"]

[script]
id = "applications-setup/waydroid-setup"

# What the script installs, so its status can be shown.
[detect]
binary = "waydroid"
debian = "waydroid"
fedora = "waydroid"
aur = "waydroid"
