name = "WINE Staging"
description = "WINE with the staging patches, newer fixes that are not yet in WINE itself. It replaces WINE, so remove WINE first; while WINE is installed this shows as already installed. Arch only."
flags = "I"
order = 106

[[preconditions]]
matches = true
check = "command_exists"
values = ["pacman"]

[package]
binary = "wine"
arch = "wine-staging"
removable = true
