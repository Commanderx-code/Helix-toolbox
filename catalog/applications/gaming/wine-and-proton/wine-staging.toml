name = "WINE Staging"
description = "WINE with the staging patches, newer fixes that are not yet in WINE itself. It replaces WINE: when WINE is installed, pacman asks before removing it. Arch only."
flags = "I"
order = 106

[[preconditions]]
matches = true
check = "command_exists"
values = ["pacman"]

[package]
arch = "wine-staging"
suse = "wine-staging"
conflicts = ["wine"]
removable = true
