name = "Proton CachyOS"
description = "CachyOS's Proton build for Steam, with extra fixes and optimizations (the Steam Linux Runtime build). Choose it under a game's Properties, Compatibility in Steam. Arch only, from Chaotic-AUR or the AUR (proton-cachyos-slr)."
flags = "I"
order = 103

[[preconditions]]
matches = true
check = "command_exists"
values = ["pacman"]

[package]
aur = "proton-cachyos-slr"
removable = true

[needs]
# Proton runs x86 Windows games, and this build is for x86_64 only.
architectures = ["x86_64"]
