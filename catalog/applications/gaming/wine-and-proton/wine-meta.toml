name = "WINE Meta"
description = "Garuda's meta-package for WINE: WINE with Gecko, Mono, Winetricks, WineASIO and the libraries Windows games commonly need. Garuda only."
flags = "I"
order = 107

[[preconditions]]
matches = true
check = { containing_file = "/etc/os-release" }
values = ["ID=garuda"]

# A meta-package adds no command of its own; the package manager confirms it.
[package]
binary = "wine-meta"
arch = "wine-meta"
removable = true
