name = "Luxtorpeda"
description = "A Steam compatibility tool that runs games with native Linux engines instead of their Windows builds. Choose it under a game's Properties, Compatibility in Steam. Arch only, from the AUR (luxtorpeda-bin)."
flags = "I"
order = 102

[[preconditions]]
matches = true
check = "command_exists"
values = ["pacman"]

# A Steam compatibility tool adds no command; the package manager confirms it.
[package]
binary = "luxtorpeda-bin"
aur = "luxtorpeda-bin"
removable = true
