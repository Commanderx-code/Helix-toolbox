name = "FreeOffice"
flags = "I"
order = 101

[script]
id = "applications-setup/office-suites/freeoffice"

# What the script installs, so its status can be shown.
[detect]
debian = "softmaker-freeoffice-2024"
fedora = "softmaker-freeoffice-2024"
aur = "freeoffice"

[needs]
# SoftMaker's packages the installer uses are x86_64 builds.
architectures = ["x86_64"]
