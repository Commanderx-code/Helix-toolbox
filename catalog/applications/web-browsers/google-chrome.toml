name = "Google Chrome"
description = "Google Chrome is a fast, secure, and free web browser, built for the modern web."
flags = "I"
order = 104

[script]
id = "applications-setup/browsers/google-chrome"

# What the script installs, so its status can be shown.
[detect]
binary = "google-chrome-stable"
debian = "google-chrome-stable"
fedora = "google-chrome-stable"
aur = "google-chrome"
flatpak = "com.google.Chrome"

[needs]
# Google's packages and repositories the installer uses are x86_64 builds.
architectures = ["x86_64"]
