name = "Garuda Limine Boot Menu"
description = "Install the Garuda dr460nized look from dotfiles on a machine that boots with Limine: the dr460nized wallpaper and colours with a two-second timeout merged into the global settings of limine.conf. Boot entries and kernel arguments stay as they are; the previous file is backed up."
flags = "PFM"
multi_select = false
order = 2

[[preconditions]]
matches = true
check = "command_exists"
values = ["limine"]

[script]
id = "commander/limine-garuda"
