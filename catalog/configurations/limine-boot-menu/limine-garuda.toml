name = "Garuda Limine Boot Menu"
description = "Install the Garuda dr460nized look from dotfiles on a machine that boots with Limine: the dr460nized wallpaper and colors with a two-second timeout merged into the global settings of limine.conf. Boot entries and kernel arguments stay as they are; the previous file is backed up."
flags = "PFM"
multi_select = false
order = 2

[[preconditions]]
matches = true
check = "command_exists"
values = ["limine"]

[script]
id = "commander/limine-garuda"

# What it changes, for the change preview.
[effects]
takes_effect = "the boot menu looks different from the next reboot"
unknown = ["where limine.conf is: as /etc/default/limine's ESP_PATH says, or under /boot, /efi or /boot/efi", "the merged colors and timeout: they come from dotfiles at its pinned commit, read when it runs"]

[[effects.files]]
path = "/boot/limine.conf"
change = "the look's colors and a two-second timeout merged into its global settings; boot entries and kernel arguments stay; backed up first"
when = "limine.conf is on /boot"

[[effects.files]]
path = "/boot/dotfiles-splash.png"
change = "the look's wallpaper, beside limine.conf"
when = "limine.conf is on /boot"

# What it leaves, checked after the run.
# Beside limine.conf, wherever it is; the file itself may be root's only.

[[verify]]
kind = "path"
path = "/boot/dotfiles-splash.png"
is = "file"
when_exists = "/boot/limine.conf"

[[verify]]
kind = "path"
path = "/efi/dotfiles-splash.png"
is = "file"
when_exists = "/efi/limine.conf"

[[verify]]
kind = "path"
path = "/boot/efi/dotfiles-splash.png"
is = "file"
when_exists = "/boot/efi/limine.conf"
