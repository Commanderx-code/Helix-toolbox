name = "Disable Boot Splash"
description = "Remove 'splash' and 'rhgb' from the kernel command line in /etc/default/grub or /etc/default/limine and regenerate the boot menu, so the system boots with text output. Plymouth and its themes stay installed. Backups are created before changes."
flags = "PFM"
multi_select = false
order = 4

[script]
id = "commander/plymouth-off"

# What it changes, for the change preview.
[effects]
takes_effect = "the system boots with text output from the next reboot"
unknown = ["which boot loader file changes: /etc/default/limine where the Limine entry tool is installed, otherwise /etc/default/grub", "the regenerated boot menu, written from the installed kernels when it runs"]

[[effects.files]]
path = "/etc/default/grub"
change = "removes splash and rhgb from the kernel command line; backed up first"
render = ["grub-cmdline", "/etc/default/grub", "remove", "splash", "rhgb"]
when = "the machine boots with GRUB"

[[effects.files]]
path = "/etc/default/limine"
change = "removes splash and rhgb from the kernel command line; backed up first"
render = ["limine-cmdline", "/etc/default/limine", "remove", "splash", "rhgb"]
when = "the Limine entry tool manages the boot entries"
