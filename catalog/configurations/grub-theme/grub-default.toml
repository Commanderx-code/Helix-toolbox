name = "Restore Default GRUB Appearance"
description = "Disable custom themes and backgrounds and restore a plain console menu. Preserves current kernel arguments, disk settings and boot entries; does not reinstall GRUB. Backups are created before changes; the regenerated menu is syntax-checked before replacing the current one."
flags = "PFM"
multi_select = false
order = 14

[[preconditions]]
matches = true
check = "file_exists"
values = ["/etc/default/grub"]

[script]
id = "commander/grub-default"

# What it changes, for the change preview.
[effects]
takes_effect = "the boot menu looks different from the next reboot"
unknown = ["the regenerated boot menu: grub-mkconfig writes it from the installed kernels when it runs"]

[[effects.files]]
path = "/etc/default/grub"
change = "turns the theme and background off and selects console output; kernel arguments and disk settings stay; backed up first"
render = ["grub", "/etc/default/grub", "", ""]

[[effects.files]]
path = "{grub}/grub.cfg"
change = "regenerated with the new settings; checked with grub-script-check before it replaces the current menu, which is backed up"

# What it leaves, checked after the run.
[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_THEME"
unset = true

[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_TERMINAL_OUTPUT"
equals = "console"
