name = "Vimix GRUB Theme"
description = "Install Vimix from vinceliuice/grub2-themes; choose 1080p, 2K or 4K assets. Backups are created before changes; the regenerated menu is syntax-checked before replacing the current one."
flags = "I PFM MP"
multi_select = false
order = 6

[[preconditions]]
matches = true
check = "file_exists"
values = ["/etc/default/grub"]

[script]
id = "commander/grub-vimix"

# What it changes, for the change preview.
[effects]
takes_effect = "the boot menu looks different from the next reboot"
unknown = ["the regenerated boot menu: grub-mkconfig writes it from the installed kernels when it runs"]

[[effects.files]]
path = "/etc/default/grub"
change = "selects the theme with graphical output; kernel arguments and disk settings stay; backed up first"
render = ["grub", "/etc/default/grub", "{grub}/themes/commander-vimix-{time}/theme.txt", ""]

[[effects.files]]
path = "{grub}/themes/commander-vimix-{time}"
change = "the theme's files, copied in from its pinned source; an earlier theme folder stays"

[[effects.files]]
path = "{grub}/grub.cfg"
change = "regenerated with the new settings; checked with grub-script-check before it replaces the current menu, which is backed up"

# What it leaves, checked after the run.
[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_THEME"
contains = "/themes/commander-vimix-"
points_to = "{value}"

[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_TERMINAL_OUTPUT"
equals = "gfxterm"

[[verify]]
kind = "path"
path = "{grub}/grub.cfg"
is = "file"
