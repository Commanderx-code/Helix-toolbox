name = "BSOL GRUB Theme"
description = "Install BSOL from ChrisTitusTech/bootloader-themes at a pinned commit. Back up current settings and syntax-check the regenerated menu while preserving kernel arguments and boot timeout."
flags = "I PFM MP"
multi_select = false
order = 13

[[preconditions]]
matches = true
check = "file_exists"
values = ["/etc/default/grub"]

[script]
id = "commander/grub-ctt-bsol"

# What it changes, for the change preview.
[effects]
takes_effect = "the boot menu looks different from the next reboot"
unknown = ["the regenerated boot menu: grub-mkconfig writes it from the installed kernels when it runs"]

[[effects.files]]
path = "/etc/default/grub"
change = "selects the theme with graphical output; kernel arguments and disk settings stay; backed up first"
render = ["grub", "/etc/default/grub", "{grub}/themes/commander-ctt-bsol-{time}/theme.txt", ""]

[[effects.files]]
path = "{grub}/themes/commander-ctt-bsol-{time}"
change = "the theme's files, copied in from its pinned source; an earlier theme folder stays"

[[effects.files]]
path = "{grub}/grub.cfg"
change = "regenerated with the new settings; checked with grub-script-check before it replaces the current menu, which is backed up"

# What it leaves, checked after the run.
[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_THEME"
contains = "/themes/commander-ctt-bsol-"
points_to = "{value}"

[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_TERMINAL_OUTPUT"
equals = "gfxterm"

[[verify]]
kind = "path"
path = "{grub}/grub.cfg"
is = "file"
