name = "Garuda GRUB Theme"
description = "Install the Garuda dr460nized GRUB theme that the dotfiles GRUB settings use, from the grub-theme-garuda-dr460nized package in the Garuda repositories. Back up existing settings and regenerate the current machine's GRUB menu while preserving kernel arguments."
flags = "I PFM MP"
multi_select = false
order = 1

[[preconditions]]
matches = true
check = "file_exists"
values = ["/etc/default/grub"]

[script]
id = "commander/grub"

# What it changes, for the change preview.
[effects]
packages = ["grub-theme-garuda-dr460nized, from the Garuda repositories"]
takes_effect = "the boot menu looks different from the next reboot"
unknown = ["the regenerated boot menu: grub-mkconfig writes it from the installed kernels when it runs"]

[[effects.files]]
path = "/etc/default/grub"
change = "selects the Garuda theme with graphical output; kernel arguments and disk settings stay; backed up first"
render = ["grub", "/etc/default/grub", "/usr/share/grub/themes/garuda-dr460nized/theme.txt", ""]

[[effects.files]]
path = "{grub}/grub.cfg"
change = "regenerated with the new settings; checked with grub-script-check before it replaces the current menu, which is backed up"

# What it leaves, checked after the run.
[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_THEME"
equals = "/usr/share/grub/themes/garuda-dr460nized/theme.txt"
points_to = "{value}"

[[verify]]
kind = "setting"
files = ["/etc/default/grub"]
key = "GRUB_TERMINAL_OUTPUT"
equals = "gfxterm"
