name = "Fedora SELinux Tools and Status"
description = "Install Fedora SELinux policy, management and diagnostic tools and show status. Preserves enforcement mode and existing local policy."
flags = "I MP"
multi_select = false
order = 2

[[preconditions]]
matches = true
check = { containing_file = "/etc/os-release" }
values = ["ID=fedora"]

[script]
id = "commander/selinux"

# What it leaves, checked after the run.
[[verify]]
kind = "path"
path = "/usr/sbin/semanage"
is = "file"

[[verify]]
kind = "path"
path = "/usr/sbin/sestatus"
is = "file"
