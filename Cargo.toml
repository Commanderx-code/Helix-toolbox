[workspace]
resolver = "2"
members = [
    "apps/helix-toolbox",
    "crates/helix-toolbox-core",
    "crates/helix-toolbox-catalog",
    "crates/helix-toolbox-platform",
    "crates/helix-toolbox-engine",
]

[workspace.package]
version = "1.23.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Commanderx-code/Helix-toolbox"
homepage = "https://github.com/Commanderx-code/Helix-toolbox"
authors = ["Commanderx-code"]

[workspace.dependencies]
# The crates of this workspace, published together at the same version;
# scripts/stamp-version.py keeps these in step with the version above.
helix-toolbox-catalog = { path = "crates/helix-toolbox-catalog", version = "=1.23.0" }
helix-toolbox-core = { path = "crates/helix-toolbox-core", version = "=1.23.0" }
helix-toolbox-engine = { path = "crates/helix-toolbox-engine", version = "=1.23.0" }
helix-toolbox-platform = { path = "crates/helix-toolbox-platform", version = "=1.23.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
# The poll(2) event source: the default edge-triggered one can leave a key
# unread when it arrives together with a resize, until the next key.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
