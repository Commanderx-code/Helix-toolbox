[workspace]
resolver = "2"
members = [
    "apps/helixforge",
    "crates/helixforge-core",
    "crates/helixforge-catalog",
    "crates/helixforge-platform",
    "crates/helixforge-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
