[workspace]
resolver = "2"
members = [
    "apps/helixforge",
    "crates/helixforge-core",
    "crates/helixforge-catalog",
    "crates/helixforge-platform",
    "crates/helixforge-engine",
]

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Commanderx-code/Helix-Forge"
homepage = "https://github.com/Commanderx-code/Helix-Forge"
authors = ["Commanderx-code"]

[workspace.dependencies]
# The crates of this workspace, published together at the same version;
# scripts/stamp-version.py keeps these in step with the version above.
helixforge-catalog = { path = "crates/helixforge-catalog", version = "=1.4.0" }
helixforge-core = { path = "crates/helixforge-core", version = "=1.4.0" }
helixforge-engine = { path = "crates/helixforge-engine", version = "=1.4.0" }
helixforge-platform = { path = "crates/helixforge-platform", version = "=1.4.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
# The poll(2) event source: the default edge-triggered one can leave a key
# unread when it arrives together with a resize, until the next key.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
