[package]
name = "helixforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Build, configure and optimize a Linux machine from a terminal menu: installs, dotfiles, updates, backups and health checks, every change planned and confirmed first."
readme = "../../README.md"
keywords = ["linux", "setup", "tui", "installer", "dotfiles"]
categories = ["command-line-utilities", "config"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm.workspace = true
helixforge-catalog.workspace = true
helixforge-core.workspace = true
helixforge-engine.workspace = true
helixforge-platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
nix = { version = "0.31", features = ["poll", "signal", "user"] }
ratatui.workspace = true
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tui-term = "0.3"
vt100 = "0.16"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
