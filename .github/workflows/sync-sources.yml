name: Sync sources and release

on:
  # dotfiles and Myfish start this run when their checks pass on main (see
  # docs/SOURCE-SYNC.md). GitHub fires schedules only every few hours on these
  # repositories, so the schedule is a backstop, not the trigger.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "manual rebuilds and publishes; source-updated builds only when something changed"
        default: manual
        type: choice
        options: [manual, source-updated]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'Commanderx-code'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      # Signed build provenance for the published files.
      id-token: write
      attestations: write
      # The Distributions record of what was verified, for the build to carry.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # The record may come from an ancestor's Distributions run.
          fetch-depth: 60
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Adopt sources with successful CI
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/sync-sources.py
      - name: Decide whether to build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Schedules and source notifications only act on a change or a
          # missing build; pushes and manual runs always build.
          ROUTINE: ${{ github.event_name == 'schedule' || inputs.reason == 'source-updated' }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          # The commit's own vX.Y.Z when it has one, else the next version; a
          # source update adds a commit, which gets the next version.
          if [ "$CHANGED" = true ]; then
            python3 -B scripts/release-version.py --changed | tee "$RUNNER_TEMP/release.txt"
          else
            python3 -B scripts/release-version.py | tee "$RUNNER_TEMP/release.txt"
          fi
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release.txt")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release.txt")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = true ] || [ "$released" = false ] || [ "$ROUTINE" != true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Nothing changed and v$version is published."
          fi
      - name: Install validation tools
        if: steps.release.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.release.outputs.build == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: The Distributions record for this commit
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Waits for Distributions on this commit and stops the release if it
        # failed; a source update, which has no run of its own, carries the
        # newest record of an ancestor.
        run: python3 -B scripts/validation-record.py fetch catalog/validation-results.json
      - name: Validate and build without installation
        if: steps.release.outputs.build == 'true'
        env:
          HELIXFORGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 -B -m unittest discover -s tests/installers -v
          shellcheck -x -P . scripts/shared/*.sh scripts/installers/*.sh scripts/installers/commander/*.sh
          find scripts/installers -name '*.sh' -not -path '*/commander/*' -print0 | xargs -0 shellcheck -x -P . -S error
          cargo build --release -p helixforge
          target/release/helixforge docgen docs/walkthrough.md
          target/release/helixforge --help >/dev/null
          target/release/helixforge --version | grep -qx "helixforge $HELIXFORGE_VERSION"
      - name: Package the tested build
        if: steps.release.outputs.build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p /tmp/helixforge-release
          cp target/release/helixforge /tmp/helixforge-release/helixforge-linux-x86_64
          cp catalog/validation-results.json /tmp/helixforge-release/validation.json
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$VERSION" target/release/helixforge /tmp/helixforge-release
          cd /tmp/helixforge-release
          sha256sum helixforge-linux-x86_64 helixforge_*.deb helixforge-*.rpm helixforge-*.pkg.tar.zst validation.json > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where the files were built
        if: steps.release.outputs.build == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            /tmp/helixforge-release/helixforge-linux-x86_64
            /tmp/helixforge-release/helixforge_*.deb
            /tmp/helixforge-release/helixforge-*.rpm
            /tmp/helixforge-release/helixforge-*.pkg.tar.zst
      - name: Commit tested source updates
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog scripts/installers/commander/common.sh scripts/installers/commander/catalogs docs/walkthrough.md
          git add -A scripts/installers/commander/generated
          git commit -m 'Sync tested dotfiles and Myfish sources'
          # A concurrent human push stops this run; never force or publish an unpushed build.
          git push origin HEAD:main
      - name: Publish the tested Linux x86_64 build
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          revision=$(git rev-parse HEAD)
          tag="v$VERSION"
          python3 -B scripts/sync-sources.py --render
          git diff --exit-code
          cd /tmp/helixforge-release
          {
            printf 'HelixForge %s, built from commit %s.\n\n' "$tag" "$revision"
            printf 'Linux x86_64; built on Ubuntu 22.04 (glibc 2.35 or newer).\n\n'
            printf 'Install the package for your distribution, or run the program directly:\n\n'
            printf '```sh\n'
            printf 'sudo pacman -U helixforge-%s-1-x86_64.pkg.tar.zst   # Arch and derivatives\n' "$VERSION"
            printf 'sudo apt install ./helixforge_%s-1_amd64.deb        # Debian, Ubuntu\n' "$VERSION"
            printf 'sudo dnf install ./helixforge-%s-1.x86_64.rpm       # Fedora\n' "$VERSION"
            printf 'sudo zypper install --allow-unsigned-rpm ./helixforge-%s-1.x86_64.rpm   # openSUSE\n' "$VERSION"
            printf '```\n\n'
            printf 'Check a download with %s, and where it was built with %s. See docs/INSTALL.md.\n' \
              "\`sha256sum --check --ignore-missing SHA256SUMS\`" \
              "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`"
          } > release-notes.md
          # A draft left by a failed run may point at an older commit; start again.
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Draft first: a failed upload never exposes a partial release as the latest build.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$revision" --draft --title "HelixForge $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" helixforge-linux-x86_64 helixforge_*.deb helixforge-*.rpm helixforge-*.pkg.tar.zst validation.json SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
      - name: Publish the crates to crates.io
        if: steps.release.outputs.build == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Publishing needs a token (docs/RELEASING.md); without one, skip.
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN secret with a value; not publishing to crates.io."
            exit 0
          fi
          # The crates carry the release's version; the checkout is not committed.
          python3 -B scripts/stamp-version.py "$VERSION"
          cargo update --workspace
          # In dependency order; one already there (a rerun after a partial
          # publish) is skipped. Each publish waits until crates.io serves it.
          for crate in helixforge-core helixforge-platform helixforge-catalog helixforge-engine helixforge; do
            if curl -fsS -o /dev/null -A "helixforge-release (github.com/$GITHUB_REPOSITORY)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish -p "$crate" --allow-dirty
            fi
          done
