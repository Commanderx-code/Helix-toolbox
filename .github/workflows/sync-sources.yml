name: Sync sources and release

on:
  # dotfiles and Myfish start this run when their checks pass on main (see
  # docs/SOURCE-SYNC.md). GitHub fires schedules only every few hours on these
  # repositories, so the schedule is a backstop, not the trigger.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "manual rebuilds and publishes; source-updated builds only when something changed"
        default: manual
        type: choice
        options: [manual, source-updated]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'Commanderx-code'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      # The Distributions record of what was verified, for the build to carry.
      actions: read
    outputs:
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # The record may come from an ancestor's Distributions run.
          fetch-depth: 60
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Adopt sources with successful CI
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/sync-sources.py
      - name: Decide whether to build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Schedules and source notifications only act on a change or a
          # missing build; pushes and manual runs always build.
          ROUTINE: ${{ github.event_name == 'schedule' || inputs.reason == 'source-updated' }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          # The commit's own vX.Y.Z when it has one, else the next version; a
          # source update adds a commit, which gets the next version.
          if [ "$CHANGED" = true ]; then
            python3 -B scripts/release-version.py --changed | tee "$RUNNER_TEMP/release.txt"
          else
            python3 -B scripts/release-version.py | tee "$RUNNER_TEMP/release.txt"
          fi
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release.txt")
          released=$(sed -n 's/^released=//p' "$RUNNER_TEMP/release.txt")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = true ] || [ "$released" = false ] || [ "$ROUTINE" != true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Nothing changed and v$version is published."
          fi
      - name: Install validation tools
        if: steps.release.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.release.outputs.build == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: The Distributions record for this commit
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Waits for Distributions on this commit and stops the release if it
        # failed; a source update, which has no run of its own, carries the
        # newest record of an ancestor.
        run: python3 -B scripts/validation-record.py fetch catalog/validation-results.json
      - name: Validate and build without installation
        if: steps.release.outputs.build == 'true'
        env:
          HELIX_TOOLBOX_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 -B -m unittest discover -s tests/installers -v
          shellcheck -x -P . scripts/shared/*.sh scripts/installers/*.sh scripts/installers/commander/*.sh
          find scripts/installers -name '*.sh' -not -path '*/commander/*' -print0 | xargs -0 shellcheck -x -P . -S error
          cargo build --release -p helix-toolbox
          target/release/helix-toolbox docgen docs/walkthrough.md
          target/release/helix-toolbox --help >/dev/null
          target/release/helix-toolbox --version | grep -qx "helix-toolbox $HELIX_TOOLBOX_VERSION"
      - name: Package the tested build
        if: steps.release.outputs.build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p /tmp/helix-toolbox-release
          cp target/release/helix-toolbox /tmp/helix-toolbox-release/helix-toolbox-linux-x86_64
          cp catalog/validation-results.json /tmp/helix-toolbox-release/validation.json
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$VERSION" target/release/helix-toolbox /tmp/helix-toolbox-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.build == 'true'
        with:
          name: release-x86_64
          path: /tmp/helix-toolbox-release/
      - name: Commit tested source updates
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog scripts/installers/commander/common.sh scripts/installers/commander/catalogs docs/walkthrough.md
          git add -A scripts/installers/commander/generated
          git commit -m 'Sync tested dotfiles and Myfish sources'
          # A concurrent human push stops this run; never force or publish an unpushed build.
          git push origin HEAD:main
      - name: The commit the release is built from
        id: revision
        if: steps.release.outputs.build == 'true'
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same commit built and tested on an ARM64 machine, with the same
  # Distributions record.
  arm64:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sync.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-x86_64
          path: ${{ runner.temp }}/x86_64
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Test and build on ARM64
        env:
          HELIX_TOOLBOX_VERSION: ${{ needs.sync.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/x86_64/validation.json" catalog/validation-results.json
          cargo test --workspace
          cargo build --release -p helix-toolbox
          target/release/helix-toolbox --help >/dev/null
          target/release/helix-toolbox --version | grep -qx "helix-toolbox $HELIX_TOOLBOX_VERSION"
      - name: Package the tested build
        env:
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp target/release/helix-toolbox "$RUNNER_TEMP/release/helix-toolbox-linux-aarch64"
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$VERSION" target/release/helix-toolbox "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-aarch64
          path: ${{ runner.temp }}/release/

  publish:
    needs: [sync, arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      # Signed build provenance for the published files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sync.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: /tmp/helix-toolbox-release
          merge-multiple: true
      # Copies of 1.6 and older, and launchers made for them, update from the
      # files named for HelixForge; these are the same files under that name.
      - name: Copies under the name before 1.7
        run: |
          cd /tmp/helix-toolbox-release
          for file in helix-toolbox-linux-* helix-toolbox_*.deb helix-toolbox-*.rpm helix-toolbox-*.pkg.tar.zst; do
            cp -- "$file" "helixforge${file#helix-toolbox}"
          done
          ls -1
      - name: Checksums of the tested builds
        run: |
          cd /tmp/helix-toolbox-release
          sha256sum helix-toolbox-linux-x86_64 helix-toolbox-linux-aarch64 helix-toolbox_*.deb helix-toolbox-*.rpm \
            helix-toolbox-*.pkg.tar.zst helixforge-linux-* helixforge_*.deb helixforge-*.rpm helixforge-*.pkg.tar.zst \
            validation.json > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            /tmp/helix-toolbox-release/helix-toolbox-linux-*
            /tmp/helix-toolbox-release/helix-toolbox_*.deb
            /tmp/helix-toolbox-release/helix-toolbox-*.rpm
            /tmp/helix-toolbox-release/helix-toolbox-*.pkg.tar.zst
      - name: Publish the tested Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          revision=$(git rev-parse HEAD)
          tag="v$VERSION"
          python3 -B scripts/sync-sources.py --render
          git diff --exit-code
          cd /tmp/helix-toolbox-release
          {
            printf 'Helix Toolbox %s, built from commit %s.\n\n' "$tag" "$revision"
            printf 'Linux x86_64 and aarch64 (ARM64), built on Ubuntu 22.04 (glibc 2.35 or newer).\n\n'
            printf 'Install the package for your distribution, or run the program directly:\n\n'
            printf '```sh\n'
            printf '# x86_64\n'
            printf 'sudo pacman -U helix-toolbox-%s-1-x86_64.pkg.tar.zst   # Arch and derivatives\n' "$VERSION"
            printf 'sudo apt install ./helix-toolbox_%s-1_amd64.deb        # Debian, Ubuntu\n' "$VERSION"
            printf 'sudo dnf install ./helix-toolbox-%s-1.x86_64.rpm       # Fedora\n' "$VERSION"
            printf 'sudo zypper install --allow-unsigned-rpm ./helix-toolbox-%s-1.x86_64.rpm   # openSUSE\n\n' "$VERSION"
            printf '# aarch64 (ARM64)\n'
            printf 'sudo pacman -U helix-toolbox-%s-1-aarch64.pkg.tar.zst  # Arch Linux ARM\n' "$VERSION"
            printf 'sudo apt install ./helix-toolbox_%s-1_arm64.deb        # Debian, Ubuntu, Raspberry Pi OS\n' "$VERSION"
            printf 'sudo dnf install ./helix-toolbox-%s-1.aarch64.rpm      # Fedora, Fedora Asahi Remix\n' "$VERSION"
            printf 'sudo zypper install --allow-unsigned-rpm ./helix-toolbox-%s-1.aarch64.rpm   # openSUSE\n' "$VERSION"
            printf '```\n\n'
            printf 'Check a download with %s, and where it was built with %s. See docs/INSTALL.md.\n' \
              "\`sha256sum --check --ignore-missing SHA256SUMS\`" \
              "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`"
            printf '\nThe files named helixforge-* are the same files under the name before 1.7, for copies of HelixForge to update from.\n'
          } > release-notes.md
          # A draft left by a failed run may point at an older commit; start again.
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Draft first: a failed upload never exposes a partial release as the latest build.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$revision" --draft --title "Helix Toolbox $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" helix-toolbox-linux-x86_64 helix-toolbox-linux-aarch64 helix-toolbox_*.deb helix-toolbox-*.rpm \
            helix-toolbox-*.pkg.tar.zst helixforge-linux-* helixforge_*.deb helixforge-*.rpm helixforge-*.pkg.tar.zst \
            validation.json SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          # Publishing needs a token (docs/RELEASING.md); without one, skip.
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN secret with a value; not publishing to crates.io."
            exit 0
          fi
          # The crates carry the release's version; the checkout is not committed.
          python3 -B scripts/stamp-version.py "$VERSION"
          cargo update --workspace
          # In dependency order; one already there (a rerun after a partial
          # publish) is skipped. Each publish waits until crates.io serves it.
          for crate in helix-toolbox-core helix-toolbox-platform helix-toolbox-catalog helix-toolbox-engine helix-toolbox; do
            if curl -fsS -o /dev/null -A "helix-toolbox-release (github.com/$GITHUB_REPOSITORY)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish -p "$crate" --allow-dirty
            fi
          done
