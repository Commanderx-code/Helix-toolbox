name: Release integrity

# What a release is made of, checked: no dependency with a known
# vulnerability or a license that does not allow sharing Helix Toolbox,
# crates only from crates.io (deny.toml); the window's frontend
# dependencies audited; software bills of materials that can be made; and,
# off pull requests, that the release binary builds the same twice. The
# JSON shapes and the files earlier releases wrote are checked in Checks
# (apps/helix-toolbox/tests/contracts.rs). Weekly too, for advisories
# published since the last change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny,cargo-cyclonedx
      # One deny.toml serves both workspaces, so a license or exception only
      # one of them uses is not a mistake.
      - name: The command line's crates (vulnerabilities, licenses, sources)
        run: cargo deny check -A license-not-encountered -A license-exception-not-encountered
      - name: The window's crates
        run: |
          cargo deny --manifest-path apps/helix-toolbox-gui/src-tauri/Cargo.toml check \
            -A license-not-encountered -A license-exception-not-encountered
      - name: The window's frontend packages
        working-directory: apps/helix-toolbox-gui
        run: |
          npm audit --omit=dev --audit-level=high
          # Build tools do not ship, but a severe problem in them is worth knowing.
          npm audit --audit-level=critical
      - name: Software bills of materials
        run: scripts/sbom.sh sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom

  reproducible:
    if: github.event_name != 'pull_request'
    # Where releases are built.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: The release binary is the same from two builds
        env:
          HELIX_TOOLBOX_VERSION: 0.0.0
        run: |
          # Each from nothing, in a folder of its own.
          for build in first second; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/$build" cargo build --locked --release -p helix-toolbox
          done
          sha256sum "$RUNNER_TEMP"/first/release/helix-toolbox "$RUNNER_TEMP"/second/release/helix-toolbox | tee sums.txt
          if [ "$(cut -d' ' -f1 sums.txt | sort -u | wc -l)" != 1 ]; then
            echo "two builds of the same commit differ" >&2
            exit 1
          fi
