name: Distributions

# Helix Toolbox in real distribution containers: detection, the visible catalog,
# real package installs through the engine, script and native entries, and the
# installer tests under each distribution's own /bin/sh.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arm-vms:
        description: "also run the ARM64 virtual machines, emulated, which take hours"
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo build --locked --release -p helix-toolbox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helix-toolbox
          path: target/release/helix-toolbox
      - name: Arch, Debian and RPM packages of the build
        run: |
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$version" target/release/helix-toolbox dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/

  # The same build for ARM64 (aarch64), on an ARM machine, where the tests
  # run as well.
  build-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo build --locked --release -p helix-toolbox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helix-toolbox-aarch64
          path: target/release/helix-toolbox
      - name: Arch, Debian and RPM packages of the build
        run: |
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$version" target/release/helix-toolbox dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-aarch64
          path: dist/

  # The window's packages, built as the release builds them, for the
  # window job to install.
  build-window:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    name: build-window ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install WebKitGTK and the other libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: The Debian package, the RPM, the AppImage and the Arch package
        working-directory: apps/helix-toolbox-gui
        run: |
          npm ci --no-fund --no-audit
          npx tauri build --bundles deb,rpm,appimage
          mkdir -p "$RUNNER_TEMP/window"
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/window/"
          ../../scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../Cargo.toml | head -n 1)
          PATH="$RUNNER_TEMP/bin:$PATH" ../../scripts/package-gui.sh "$version" src-tauri/target/release/helix-toolbox-gui "$RUNNER_TEMP/window"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: window-${{ matrix.arch }}
          path: ${{ runner.temp }}/window/

  # Arch Linux ARM has no image on Docker Hub: its own root file system,
  # checked against its build key, becomes one here
  # (scripts/arch-arm-tests.sh).
  arch-arm64:
    needs: build-arm64
    runs-on: ubuntu-24.04-arm
    name: archlinuxarm on aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helix-toolbox-aarch64
          path: bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-aarch64
          path: packages
      - name: The Arch Linux ARM root file system, checked against its build key
        run: |
          url=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/root.tar.gz" "$url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/root.tar.gz.sig" "$url.sig"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import scripts/keys/archlinuxarm-build.asc
          # Signed by that key and no other; plain HTTP is safe only so.
          gpg --batch --status-fd 1 --verify "$RUNNER_TEMP/root.tar.gz.sig" "$RUNNER_TEMP/root.tar.gz" |
            grep -q '^\[GNUPG:\] VALIDSIG 68B3537F39A313B3E574D06777193F152BDBE6A6 '
          docker import "$RUNNER_TEMP/root.tar.gz" archlinuxarm:checked
          rm "$RUNNER_TEMP/root.tar.gz"
      - name: Helix Toolbox in Arch Linux ARM
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo archlinuxarm:checked \
            /bin/bash -e scripts/arch-arm-tests.sh validation-arch-arm64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-arch-arm64
          path: validation-arch-arm64.json

  distribution:
    needs: [build, build-arm64]
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            family: Arch
            group: Arch
            removable: ''
            program: ''
          - image: debian:stable
            family: Debian
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
          - image: ubuntu:24.04
            family: Debian
            group: Ubuntu
            removable: mypaint
            program: mypaint
          # The oldest release the packages are built for (glibc 2.35).
          - image: ubuntu:22.04
            family: Debian
            # The Ubuntu group's entries need 24.04.
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
          - image: fedora:latest
            family: Fedora
            group: Fedora
            removable: mupen-64-plus
            program: mupen64plus
          - image: opensuse/tumbleweed:latest
            family: openSUSE
            group: ''
            removable: mupen-64-plus
            program: mupen64plus
          # The ARM64 build on ARM machines; Arch Linux has no official ARM image.
          - image: debian:stable
            family: Debian
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: ubuntu:24.04
            family: Debian
            group: Ubuntu
            removable: mypaint
            program: mypaint
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: ubuntu:22.04
            family: Debian
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: fedora:latest
            family: Fedora
            group: Fedora
            removable: mupen-64-plus
            program: mupen64plus
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: opensuse/tumbleweed:latest
            family: openSUSE
            group: ''
            removable: mupen-64-plus
            program: mupen64plus
            arch: aarch64
            runner: ubuntu-24.04-arm
    container: ${{ matrix.image }}
    name: ${{ matrix.image }}${{ matrix.arch && ' on aarch64' || '' }}
    steps:
      - name: Base tools
        run: |
          case "${{ matrix.family }}" in
            Arch) pacman -Syu --noconfirm --needed sudo git python which ;;
            Debian)
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y sudo git python3 curl ca-certificates
              # The installer tests read TOML; Python before 3.11 needs tomli.
              python3 -c 'import tomllib' 2>/dev/null || apt-get install -y python3-tomli ;;
            Fedora) dnf install -y sudo git python3 which findutils ;;
            openSUSE)
              zypper --non-interactive install sudo git python3 which findutils curl tar gzip gawk
              # zypper takes answers only from a terminal; the other package
              # managers read the "yes" piped into each run below. Answer for
              # it the same way, where sudo's secure path finds it.
              mv /usr/bin/zypper /usr/bin/zypper.real
              printf '#!/bin/sh\nexec /usr/bin/zypper.real --non-interactive "$@"\n' > /usr/bin/zypper
              chmod +x /usr/bin/zypper ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.arch && 'helix-toolbox-aarch64' || 'helix-toolbox' }}
          path: bin
      - name: Detection
        run: |
          chmod +x bin/helix-toolbox
          bin/helix-toolbox system | tee system.txt
          grep -q "Package manager: .*(${{ matrix.family }} family)" system.txt
      - name: The catalog on this distribution
        run: |
          bin/helix-toolbox list > visible.txt
          bin/helix-toolbox list --all > all.txt
          visible=$(grep -vE '/$' visible.txt | grep -cE '^\s')
          total=$(grep -vE '/$' all.txt | grep -cE '^\s')
          echo "Visible entries: $visible of $total"
          test "$total" -ge 230
          test "$visible" -ge 100
          if [ -n "${{ matrix.group }}" ]; then
            grep -q "^    ${{ matrix.group }}/$" visible.txt
          fi
      - name: Real package installs through the engine
        run: |
          bin/helix-toolbox plan htop
          yes | bin/helix-toolbox run htop ripgrep --yes | tee run.txt
          command -v htop
          command -v rg
          # Verified by the package manager, not by the command on the PATH.
          grep -qE '^Verified: htop: (pacman|dpkg|dnf|zypper) lists htop' run.txt
          grep -qE '^Verified: Ripgrep: (pacman|dpkg|dnf|zypper) lists ripgrep' run.txt
          bin/helix-toolbox plan developer-basics | tee plan.txt
          grep -qE 'Ripgrep: already installed \((pacman|dpkg|dnf|zypper) lists ripgrep\)' plan.txt
          bin/helix-toolbox history --limit 1 | grep -q 'ok .*exit 0, verified'
          # Their status: installed, from the family's package manager, with a version.
          bin/helix-toolbox status htop ripgrep | tee status.txt
          grep -qE '^htop +Installed +(pacman|apt|dnf|zypper) [0-9]' status.txt
          grep -qE '^Ripgrep +Installed +(pacman|apt|dnf|zypper) [0-9]' status.txt
          # The health checks run read-only on each distribution.
          bin/helix-toolbox doctor | tee doctor.txt
          grep -qE '^(OK|Notice|Problem) +Disk space: ' doctor.txt
          grep -qE '^(OK|Notice|Problem) +Network: ' doctor.txt
          if bin/helix-toolbox doctor --repair no-such-check --yes; then
            echo "an unknown repair ran" >&2
            exit 1
          fi
          # Freshly installed, so nothing to update; on Arch it would be the whole system.
          bin/helix-toolbox update htop --dry-run | tee update.txt
          grep -qE '^htop: up to date \((pacman|apt|dnf|zypper) [0-9]' update.txt
      - name: More package entries every family has (git is already there)
        run: |
          yes | bin/helix-toolbox run neovim btop --yes --keep-going | tee more.txt
          for name in Neovim btop; do
            grep -qE "^Verified: $name: " more.txt
          done
      - name: Drift sees what changed since a baseline
        run: |
          echo one > "$HOME/drift-sample.conf"
          bin/helix-toolbox drift save "Before" --path "$HOME/drift-sample.conf"
          bin/helix-toolbox drift list | grep -q '^before  Before '
          bin/helix-toolbox drift check --exit-code
          echo two > "$HOME/drift-sample.conf"
          yes | bin/helix-toolbox run fzf --yes > /dev/null
          case "${{ matrix.family }}" in
            Arch) pacman -R --noconfirm htop ;;
            Debian) apt-get remove -y htop ;;
            Fedora) dnf remove -y htop ;;
            openSUSE) zypper remove htop ;;
          esac
          status=0
          bin/helix-toolbox drift check --exit-code > drift.txt || status=$?
          cat drift.txt
          test "$status" = 1
          grep -qE '^Missing +htop +was installed \((pacman|apt|dnf|zypper)' drift.txt
          grep -qE '^Added +fzf ' drift.txt
          grep -qE '^Changed +~/drift-sample.conf ' drift.txt
          grep -q 'helix-toolbox run htop$' drift.txt
          bin/helix-toolbox drift check --json > drift.json
          python3 -c 'import json; d = json.load(open("drift.json"))["data"]; assert d["restore"] == ["htop"], d; assert {"missing", "added", "file-changed"} <= {x["kind"] for x in d["differences"]}, d'
          # What restores it plans like any run, without changing anything.
          restore=$(python3 -c 'import json; print(json.load(open("drift.json"))["data"]["restore"][0])')
          bin/helix-toolbox run "$restore" --dry-run | grep -q '^1\. htop$'
      - name: The change preview and the hardware center, read-only
        run: |
          # htop was removed by the Drift step above.
          bin/helix-toolbox plan htop --effects | tee effects.txt
          grep -qE '✓ installs htop from (pacman|apt-get|dnf|zypper)' effects.txt
          case "${{ matrix.family }}" in
            Arch) grep -qE '✓ pacman (lists nothing else|would also install)' effects.txt ;;
            Debian) grep -qE '✓ apt (lists nothing else|would also install)' effects.txt ;;
            *) grep -q '? which dependencies' effects.txt ;;
          esac
          bin/helix-toolbox plan htop --effects --json | python3 -c 'import json, sys; d = json.load(sys.stdin)["data"]; assert d["effects"][0]["changes"][0]["certainty"] == "known", d'
          # Containers have no GRUB, and the preview says so instead of guessing.
          bin/helix-toolbox plan grub-dracula --effects | grep -q '/etc/default/grub: .*it is not on this machine, so this does not apply'
          bin/helix-toolbox hardware | tee hardware.txt
          grep -q '^Firmware$' hardware.txt
          grep -q '^Disks$' hardware.txt
          bin/helix-toolbox hardware --json | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == 1 and "disks" in d["data"], d'
          bin/helix-toolbox hardware --smart nvme0n1 --dry-run | grep -q 'sudo smartctl --health --attributes /dev/nvme0n1'
          if bin/helix-toolbox hardware --smart '../sda' --dry-run; then
            echo "a disk name with a path was accepted" >&2
            exit 1
          fi
      - name: The setup wizard's plans and the desktop, read-only
        run: |
          bin/helix-toolbox setup | tee setup.txt
          grep -qE '^Packages +(pacman|APT|DNF|zypper)' setup.txt
          grep -q '^  developer ' setup.txt
          # A workstation's plan only plans: nothing is installed.
          bin/helix-toolbox setup minimal | tee minimal.txt
          grep -q 'The plan, which nothing has run' minimal.txt
          grep -q 'To run it, after reading it: helix-toolbox run ' minimal.txt
          bin/helix-toolbox setup developer --json | python3 -c 'import json, sys; d = json.load(sys.stdin)["data"]; assert d["chosen"] == "developer" and any(s["id"] == "git" for s in d["suggestions"]), d'
          if bin/helix-toolbox setup no-such-workstation; then
            echo "an unknown workstation was accepted" >&2
            exit 1
          fi
          # Containers run no desktop, and it says so.
          bin/helix-toolbox desktop | grep -q '^Desktop   none found'
      - name: An offline bundle is made, checked and installed from
        run: |
          # htop was removed by the Drift step above. Steam, a script, needs
          # the network; there is no Steam for ARM.
          if [ -n "${{ matrix.arch }}" ]; then
            bin/helix-toolbox bundle create /tmp/bundle htop | tee bundle.txt
          else
            bin/helix-toolbox bundle create /tmp/bundle htop steam | tee bundle.txt
            grep -q '^Needs the network: Steam' bundle.txt
          fi
          grep -q '^Offline: htop$' bundle.txt
          (cd /tmp/bundle && sha256sum --check SHA256SUMS)
          bin/helix-toolbox bundle verify /tmp/bundle
          # A changed file is caught before anything is installed.
          cp -a /tmp/bundle /tmp/tampered
          echo changed >> /tmp/tampered/helix-toolbox
          if bin/helix-toolbox bundle install /tmp/tampered --dry-run; then
            echo "a tampered bundle was accepted" >&2
            exit 1
          fi
          yes | /tmp/bundle/helix-toolbox bundle install /tmp/bundle --yes | tee installed.txt
          command -v htop
          bin/helix-toolbox status htop | grep -qE '^htop +Installed'
      - name: Entries for x86_64 only are left out on ARM
        if: matrix.arch
        run: |
          for id in steam google-chrome install-chaotic-aur-repository resolve-native; do
            if grep -q "^ *$id " visible.txt; then
              echo "$id, for x86_64 only, shows on ${{ matrix.image }} on aarch64" >&2
              exit 1
            fi
            grep -q "^ *$id " all.txt
          done
          # Named anyway, it is blocked before anything runs.
          bin/helix-toolbox plan steam | grep -q '^Blocked: Steam is for x86_64 only, and this machine is aarch64$'
          if yes | bin/helix-toolbox run steam --yes; then
            echo "Steam ran on aarch64" >&2
            exit 1
          fi
      # WINE and Steam's gaming stack are for x86 programs.
      - name: WINE and gaming packages the catalog names exist here
        if: ${{ !matrix.arch }}
        run: |
          bin/helix-toolbox plan wine winetricks protontricks minigalaxy | tee gaming.txt
          grep -q '^[0-9]\. WINE$' gaming.txt
          case "${{ matrix.image }}" in
            archlinux:*)
              pacman -Si wine wine-staging winetricks protontricks > /dev/null
              # The CachyOS gaming lists name real Arch packages (some in multilib).
              printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
              pacman -Sy
              sed -n "s/^\(META\|APPLICATION\)_PACKAGES='\(.*\)'/\2/p" scripts/installers/commander/cachyos-gaming.sh |
                xargs pacman -Si > /dev/null ;;
            # Debian keeps winetricks and protontricks in contrib, off by default.
            debian:*) apt-cache show wine minigalaxy > /dev/null ;;
            ubuntu:*) apt-cache show wine winetricks protontricks minigalaxy > /dev/null ;;
            fedora:*) dnf info -q wine winetricks protontricks minigalaxy > /dev/null ;;
            opensuse/*)
              # Every openSUSE package the catalog names exists in the
              # distribution's repositories.
              grep -rhE '^suse = ' catalog | sed 's/^suse = "\(.*\)"$/\1/' | sort -u > suse-names.txt
              missing=0
              while read -r name; do
                if ! zypper --non-interactive --quiet search --match-exact --type package "$name" > /dev/null; then
                  echo "openSUSE has no package $name" >&2
                  missing=1
                fi
              done < suse-names.txt
              test "$missing" = 0 ;;
          esac
          # The Arch-only entries show only on Arch; Garuda's meta-package
          # nowhere here. A bare "! grep" never fails a step, so test it.
          if [ "${{ matrix.family }}" = Arch ]; then
            grep -q '^      proton-cachyos ' visible.txt
          elif grep -q 'proton-cachyos' visible.txt; then
            echo "an Arch-only entry shows on ${{ matrix.image }}" >&2
            exit 1
          fi
          if grep -q 'wine-meta' visible.txt; then
            echo "Garuda's WINE Meta shows on ${{ matrix.image }}" >&2
            exit 1
          fi
      - name: Converted package entries, removal and the AUR route
        run: |
          yes | bin/helix-toolbox run lynx --yes
          command -v lynx
          if [ -n "${{ matrix.removable }}" ]; then
            yes | bin/helix-toolbox run ${{ matrix.removable }} --yes
            command -v ${{ matrix.program }}
            bin/helix-toolbox remove ${{ matrix.removable }} --dry-run | tee removal.txt
            grep -q '^1. Remove ' removal.txt
            yes | bin/helix-toolbox remove ${{ matrix.removable }} --yes | tee removed.txt
            grep -q '^Verified: Remove .*: removed' removed.txt
            # A bare "! command" never fails a step under set -e; test it explicitly.
            # Forget the path bash remembered from the install check above, or
            # command -v reports the removed file.
            hash -r
            if command -v ${{ matrix.program }}; then
              echo "${{ matrix.program }} is still installed after removal" >&2
              exit 1
            fi
            bin/helix-toolbox remove ${{ matrix.removable }} --dry-run | grep -q 'not installed'
          else
            # Arch takes these from the AUR, then Flathub; without paru, yay
            # or flatpak the run stops before it starts.
            bin/helix-toolbox plan tenacity | grep -q -- '-S --needed tenacity'
            if bin/helix-toolbox run tenacity --yes; then
              echo "the AUR route ran without paru or yay" >&2
              exit 1
            fi
            bin/helix-toolbox remove tenacity --dry-run | grep -q 'not installed'
          fi
      - name: Falling back to the next source, and verification
        run: |
          # The distribution's own package manager is real and finds no
          # package for the fixture entries; flatpak is a stand-in, put
          # where sudo's secure path finds it.
          test ! -e /usr/bin/flatpak
          cat > /usr/bin/flatpak <<'STANDIN'
          #!/bin/sh
          case $1 in
            install) case $3 in *Missing*) ;; *) mkdir -p "/var/lib/flatpak/app/$3" ;; esac ;;
            uninstall) rm -r "/var/lib/flatpak/app/$2" ;;
          esac
          STANDIN
          chmod +x /usr/bin/flatpak
          hf() { bin/helix-toolbox --catalog-dir tests/fixtures/packages "$@"; }
          yes | hf run fallback-sample --yes | tee fallback.txt
          grep -q '^Helix Toolbox: .* failed (exit [0-9]*)' fallback.txt
          grep -q '^Helix Toolbox: trying Flathub' fallback.txt
          grep -q '^Verified: Fallback Sample: org.helixtoolbox.FallbackSample is installed from Flathub' fallback.txt
          hf plan fallback-sample | grep -q 'already installed'
          yes | hf remove fallback-sample --yes | tee removal.txt
          grep -q '^Verified: Remove Fallback Sample: removed' removal.txt
          test ! -e /var/lib/flatpak/app/org.helixtoolbox.FallbackSample
          if yes | hf run missing-sample --yes > missing.txt; then
            echo "an install that left nothing behind was trusted" >&2
            exit 1
          fi
          grep -q '^Helix Toolbox: Flathub finished, but Missing Sample is not installed' missing.txt
          hf history --limit 1 | grep -q 'failed | Missing Sample | exit 1'
          rm /usr/bin/flatpak
      - name: Update notifications, with stand-ins for systemd and the desktop
        run: |
          # No user systemd runs in a container (the openSUSE VM has one): a
          # systemctl and a notify-send that only write down what they were
          # asked.
          mkdir -p stand-ins
          # The stand-ins' own text, expanded when they run.
          # shellcheck disable=SC2016
          printf '#!/bin/sh\necho "$*" >> "%s/systemctl.log"\n' "$PWD" > stand-ins/systemctl
          # shellcheck disable=SC2016
          printf '#!/bin/sh\n[ "$1" = --help ] && exit 0\nprintf "%%s\\n" "$@" > "%s/notified.txt"\n' "$PWD" > stand-ins/notify-send
          chmod +x stand-ins/*
          export PATH="$PWD/stand-ins:$PATH" XDG_CONFIG_HOME="$PWD/notify-config" XDG_STATE_HOME="$PWD/notify-state"
          units=notify-config/systemd/user
          bin/helix-toolbox notifications on
          bin/helix-toolbox notifications | tee status.txt
          grep -q '^Notifications: on' status.txt
          grep -qx '  Updates waiting: yes' status.txt
          test -L $units/timers.target.wants/helix-toolbox-updates.timer
          grep -qx -- '--user start helix-toolbox-updates.timer' systemctl.log
          # systemd's own reading of the units, where the image has it.
          if [ -x /usr/bin/systemd-analyze ]; then
            /usr/bin/systemd-analyze verify $units/helix-toolbox-updates.timer $units/helix-toolbox-updates.service
          fi
          bin/helix-toolbox notifications check | tee check.txt
          if grep -q 'waiting$' check.txt; then
            grep -qx -- '--app-name=Helix Toolbox' notified.txt
          fi
          # New health problems on the same timer, told once.
          bin/helix-toolbox notifications health on
          bin/helix-toolbox notifications | grep -qx '  New health problems: yes'
          bin/helix-toolbox notifications check | tee health.txt
          grep -qE '^(No new health problems\.|Helix Doctor)' health.txt
          bin/helix-toolbox notifications check | grep -qx 'No new health problems.'
          bin/helix-toolbox notifications off
          test ! -e $units/helix-toolbox-updates.timer
          test ! -e $units/timers.target.wants/helix-toolbox-updates.timer
      - name: Services and storage, read and one cleanup run for real
        run: |
          # No systemd runs in a container: the services list says so and stops.
          if bin/helix-toolbox services > services.txt 2>&1; then
            echo "the services list ran without systemd" >&2
            exit 1
          fi
          grep -q 'systemd does not run this machine' services.txt
          bin/helix-toolbox startup
          bin/helix-toolbox --json storage > storage.json
          python3 -c 'import json, sys
          data = json.load(open("storage.json"))["data"]
          ids = [item["id"] for item in data["items"]]
          assert "package-cache" in ids and "unused-packages" in ids, ids
          assert not any(name.startswith(("linux", "kernel")) for item in data["items"] for name in item["packages"]), data'
          # Images often keep no package cache: then it is not offered, and says why.
          offered=$(python3 -c 'import json
          items = json.load(open("storage.json"))["data"]["items"]
          print(next(item for item in items if item["id"] == "package-cache")["not_offered"] is None)')
          if [ "$offered" = True ]; then
            bin/helix-toolbox storage clean package-cache --dry-run | tee clean.txt
            grep -q '^1\. Clean: Package cache$' clean.txt
            bin/helix-toolbox storage clean package-cache --yes
          else
            if bin/helix-toolbox storage clean package-cache --yes 2> refused.txt; then
              echo "an empty package cache was cleaned" >&2
              exit 1
            fi
            grep -q 'Package cache is not offered' refused.txt
          fi
          bin/helix-toolbox storage
      - name: Script and native entries
        run: |
          bin/helix-toolbox run system-report machine-summary --yes | tee report.txt
          grep -q '^==> System Report (script)' report.txt
          grep -q '^Distribution:' report.txt
      - name: A failing run is recorded as failed
        run: |
          printf 'name = "Fail"\n\n[command]\nline = "exit 7"\n' > /dev/null
          ! bin/helix-toolbox run definitely-not-an-entry --yes
      - name: Installer tests under this distribution's shell
        run: |
          ls -l /bin/sh
          python3 -B -m unittest discover -s tests/installers -t tests/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.arch && 'packages-aarch64' || 'packages' }}
          path: packages
      - name: The native package installs, works and removes cleanly
        run: |
          ls -l packages
          # The packages for this machine's architecture.
          case "${{ matrix.arch }}" in
            aarch64) arch=aarch64 debian=arm64 ;;
            *) arch=x86_64 debian=amd64 ;;
          esac
          case "${{ matrix.family }}" in
            Arch)
              pacman -U --noconfirm packages/helix-toolbox-*-$arch.pkg.tar.zst
              pacman -Ql helix-toolbox > files.txt ;;
            Debian)
              apt-get install -y ./packages/helix-toolbox_*_$debian.deb
              dpkg -L helix-toolbox > files.txt ;;
            Fedora)
              dnf install -y ./packages/helix-toolbox-*.$arch.rpm
              rpm -ql helix-toolbox > files.txt ;;
            openSUSE)
              # nfpm's packages are not signed with a key zypper knows.
              zypper --non-interactive install --allow-unsigned-rpm ./packages/helix-toolbox-*.$arch.rpm
              rpm -ql helix-toolbox > files.txt ;;
          esac
          # Arch and Fedora link /usr/sbin to /usr/bin, which comes first on PATH.
          test "$(readlink -f "$(command -v helix-toolbox)")" = /usr/bin/helix-toolbox
          helix-toolbox --version | grep -qE '^helix-toolbox [0-9]+\.[0-9]+\.[0-9]+$'
          helix-toolbox list --json | python3 -c 'import json, sys; assert json.load(sys.stdin)["schema"] == 1'
          helix-toolbox system | grep -q "(${{ matrix.family }} family)"
          helix-toolbox report --no-checks | tee report.txt
          grep -q '^- Installed from: package$' report.txt
          # The images leave out manual pages and documentation, so these are
          # checked in the package's own file list.
          for file in /usr/bin/helix-toolbox /usr/share/man/man1/helix-toolbox.1.gz \
              /usr/share/bash-completion/completions/helix-toolbox \
              /usr/share/zsh/site-functions/_helix-toolbox \
              /usr/share/fish/vendor_completions.d/helix-toolbox.fish \
              /usr/share/applications/helix-toolbox.desktop \
              /usr/share/icons/hicolor/512x512/apps/helix-toolbox.png; do
            grep -qE "^(helix-toolbox )?$file\$" files.txt
          done
          test -f /usr/share/bash-completion/completions/helix-toolbox
          test -f /usr/share/applications/helix-toolbox.desktop
          case "${{ matrix.family }}" in
            Arch) pacman -R --noconfirm helix-toolbox ;;
            Debian) apt-get remove -y helix-toolbox ;;
            Fedora) dnf remove -y helix-toolbox ;;
            openSUSE) zypper --non-interactive remove helix-toolbox ;;
          esac
          hash -r
          test ! -e /usr/bin/helix-toolbox
          test ! -e /usr/share/applications/helix-toolbox.desktop
      - name: Record what Helix Toolbox verified in this container
        run: |
          bin/helix-toolbox history --json --limit 1000 > history.json
          python3 -B scripts/validation-record.py record "${{ matrix.image }}${{ matrix.arch && ' on aarch64' || '' }}" history.json catalog \
            > "validation-${{ strategy.job-index }}.json"
          cat "validation-${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ strategy.job-index }}
          path: validation-${{ strategy.job-index }}.json

  # The boot, login-screen, disk and kernel entries for real, in virtual
  # machines: each is run, rebooted into and checked (scripts/vm-tests.py).
  # Cloud images on BIOS and UEFI firmware (the GRUB themes in a machine of
  # their own), the Arch live ISO for the installer, and an Arch machine
  # whose firmware says it is a Steam Deck. The Arch and openSUSE machines
  # also install offline bundles with no network.
  # The screens captured while they boot are kept for a person to look at.
  # The window on each distribution: its AppImage opened without WebKitGTK
  # installed, then its package installed with the command line's by the distribution's
  # package tool, which finds WebKitGTK and the rest, opened on a virtual
  # display and removed.
  window:
    needs: [build, build-arm64, build-window]
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            family: Arch
          - image: debian:stable
            family: Debian
          - image: ubuntu:24.04
            family: Debian
          - image: ubuntu:22.04
            family: Debian
          - image: fedora:latest
            family: Fedora
          - image: opensuse/tumbleweed:latest
            family: openSUSE
          - image: debian:stable
            family: Debian
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: ubuntu:24.04
            family: Debian
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: fedora:latest
            family: Fedora
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: opensuse/tumbleweed:latest
            family: openSUSE
            arch: aarch64
            runner: ubuntu-24.04-arm
    container: ${{ matrix.image }}
    name: window on ${{ matrix.image }}${{ matrix.arch && ' on aarch64' || '' }}
    steps:
      - name: A virtual display, and xdotool to find the window on it
        id: display
        run: |
          case "${{ matrix.family }}" in
            Arch) pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth xdotool ;;
            Debian) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth xdotool ;;
            Fedora) dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth xdotool which ;;
            openSUSE) zypper --non-interactive install xvfb-run xauth xdotool which ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: packages
        with:
          name: ${{ matrix.arch && 'packages-aarch64' || 'packages' }}
          path: packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: window
        with:
          name: window-${{ matrix.arch || 'x86_64' }}
          path: window
      - name: The AppImage opens where WebKitGTK is not installed
        env:
          # No FUSE in a container: the AppImage unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # What a desktop has whatever runs on it, and what AppImages
          # therefore leave out (fontconfig, X11, OpenGL, libgpg-error): GTK 3
          # and Mesa, and libgpg-error, which Debian's image lacks. Not
          # WebKitGTK, which the AppImage brings.
          case "${{ matrix.family }}" in
            Arch) pacman -S --noconfirm --needed gtk3 mesa ;;
            Debian) DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-3-0 libgl1 libegl1 libgbm1 libgpg-error0 ;;
            Fedora) dnf install -y gtk3 mesa-libGL mesa-libEGL mesa-libgbm ;;
            openSUSE) zypper --non-interactive install libgtk-3-0 Mesa-libGL1 Mesa-libEGL1 libgbm1 ;;
          esac
          if ldconfig -p | grep -q 'libwebkit2gtk-4\.1\.so'; then
            echo "WebKitGTK is installed, so this would not show the AppImage brings it" >&2
            exit 1
          fi
          ls -l window
          case "${{ matrix.arch }}" in
            aarch64) appimage=$(echo window/helix-toolbox-gui_*_aarch64.AppImage) ;;
            *) appimage=$(echo window/helix-toolbox-gui_*_amd64.AppImage) ;;
          esac
          chmod +x "$appimage"
          xvfb-run -a scripts/window-opens.sh "$appimage"
      - name: The window's package installs with the command line's, opens and removes cleanly
        # Whatever the AppImage did, once the display and the packages are
        # there: without them this step would only add errors of its own.
        if: ${{ !cancelled() && steps.display.outcome == 'success' && steps.packages.outcome == 'success' && steps.window.outcome == 'success' }}
        run: |
          case "${{ matrix.arch }}" in
            aarch64) arch=aarch64 debian=arm64 ;;
            *) arch=x86_64 debian=amd64 ;;
          esac
          case "${{ matrix.family }}" in
            Arch)
              pacman -U --noconfirm packages/helix-toolbox-*-$arch.pkg.tar.zst window/helix-toolbox-gui-*-$arch.pkg.tar.zst
              pacman -Ql helix-toolbox-gui > files.txt ;;
            Debian)
              apt-get install -y ./packages/helix-toolbox_*_$debian.deb ./window/helix-toolbox-gui_*_$debian.deb
              dpkg -L helix-toolbox-gui > files.txt ;;
            Fedora)
              dnf install -y ./packages/helix-toolbox-*.$arch.rpm ./window/helix-toolbox-gui-*.$arch.rpm
              rpm -ql helix-toolbox-gui > files.txt ;;
            openSUSE)
              # Neither package is signed with a key zypper knows.
              zypper --non-interactive install --allow-unsigned-rpm ./packages/helix-toolbox-*.$arch.rpm ./window/helix-toolbox-gui-*.$arch.rpm
              rpm -ql helix-toolbox-gui > files.txt ;;
          esac
          test "$(readlink -f "$(command -v helix-toolbox-gui)")" = /usr/bin/helix-toolbox-gui
          for file in /usr/bin/helix-toolbox-gui /usr/share/applications/helix-toolbox-gui.desktop \
              /usr/share/icons/hicolor/128x128/apps/helix-toolbox-gui.png \
              /usr/share/icons/hicolor/256x256/apps/helix-toolbox-gui.png; do
            grep -qE "^(helix-toolbox-gui )?$file\$" files.txt
          done
          # Every icon in a folder of the icon theme's own sizes.
          if grep -E '/icons/hicolor/[^/]*@' files.txt; then
            exit 1
          fi
          grep -qx 'Exec=helix-toolbox-gui' /usr/share/applications/helix-toolbox-gui.desktop
          # Every library it links to is there.
          if ldd /usr/bin/helix-toolbox-gui | grep 'not found'; then
            exit 1
          fi
          xvfb-run -a scripts/window-opens.sh helix-toolbox-gui
          case "${{ matrix.family }}" in
            Arch) pacman -R --noconfirm helix-toolbox-gui helix-toolbox ;;
            Debian) apt-get remove -y helix-toolbox-gui helix-toolbox ;;
            Fedora) dnf remove -y helix-toolbox-gui helix-toolbox ;;
            openSUSE) zypper --non-interactive remove helix-toolbox-gui helix-toolbox ;;
          esac
          hash -r
          test ! -e /usr/bin/helix-toolbox-gui
          test ! -e /usr/share/applications/helix-toolbox-gui.desktop

  vm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, arch-bundle, arch-themes, arch-ctt-themes, debian, fedora, opensuse, arch-uefi, arch-iso, steamdeck]
    name: vm ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helix-toolbox
          path: bin
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf genisoimage python3-pil
          ls -l /dev/kvm
      - name: The entries, run and rebooted into
        run: |
          chmod +x bin/helix-toolbox
          python3 -B scripts/vm-tests.py --distro "${{ matrix.distro }}" --binary bin/helix-toolbox \
            --work "$RUNNER_TEMP/vm" --out "validation-vm-${{ matrix.distro }}.json" --shots screens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vm-screens-${{ matrix.distro }}
          path: screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-vm-${{ matrix.distro }}
          path: validation-vm-${{ matrix.distro }}.json

  # The same cases in ARM64 virtual machines. GitHub's ARM runners offer no
  # hardware virtualization, so QEMU emulates the processor, which takes
  # hours: weekly, and when asked for, but not on every change, and not in
  # the record.
  vm-arm64:
    needs: build-arm64
    if: github.event_name == 'schedule' || inputs.arm-vms
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-arm64, fedora-arm64]
    name: vm ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helix-toolbox-aarch64
          path: bin
      - name: QEMU for ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils genisoimage python3-pil
      - name: The entries, run and rebooted into
        run: |
          chmod +x bin/helix-toolbox
          python3 -B scripts/vm-tests.py --distro "${{ matrix.distro }}" --binary bin/helix-toolbox \
            --work "$RUNNER_TEMP/vm" --out "arm-vm-${{ matrix.distro }}.json" --shots screens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vm-screens-${{ matrix.distro }}
          path: screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: arm-vm-${{ matrix.distro }}
          path: arm-vm-${{ matrix.distro }}.json
          if-no-files-found: ignore

  # One record of every container's and virtual machine's results, which
  # release builds carry for the reliability screen
  # (scripts/validation-record.py).
  record:
    needs: [distribution, arch-arm64, vm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-*
          path: parts
          merge-multiple: true
      - name: Merge the containers' records
        run: |
          python3 -B scripts/validation-record.py merge validation.json "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" parts/*.json
          python3 -c 'import json; d = json.load(open("validation.json")); assert len(d["images"]) == 12, d; assert all(i["entries"].get("htop") == "verified" for i in d["images"].values()), d; assert sorted(d["vms"]) == ["arch", "arch-bundle", "arch-ctt-themes", "arch-iso", "arch-themes", "arch-uefi", "debian", "fedora", "opensuse", "steamdeck"], d'
          cat validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation
          path: validation.json
