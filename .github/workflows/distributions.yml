name: Distributions

# HelixForge in real distribution containers: detection, the visible catalog,
# real package installs through the engine, script and native entries, and the
# installer tests under each distribution's own /bin/sh.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo build --locked --release -p helixforge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helixforge
          path: target/release/helixforge
      - name: Arch, Debian and RPM packages of the build
        run: |
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$version" target/release/helixforge dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/

  # The same build for ARM64 (aarch64), on an ARM machine, where the tests
  # run as well.
  build-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo build --locked --release -p helixforge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helixforge-aarch64
          path: target/release/helixforge
      - name: Debian and RPM packages of the build
        run: |
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package.sh "$version" target/release/helixforge dist
          # No Arch package: Arch Linux has no official ARM image to test one in.
          rm dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-aarch64
          path: dist/

  distribution:
    needs: [build, build-arm64]
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            family: Arch
            group: Arch
            removable: ''
            program: ''
          - image: debian:stable
            family: Debian
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
          - image: ubuntu:24.04
            family: Debian
            group: Ubuntu
            removable: mypaint
            program: mypaint
          # The oldest release the packages are built for (glibc 2.35).
          - image: ubuntu:22.04
            family: Debian
            # The Ubuntu group's entries need 24.04.
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
          - image: fedora:latest
            family: Fedora
            group: Fedora
            removable: mupen-64-plus
            program: mupen64plus
          - image: opensuse/tumbleweed:latest
            family: openSUSE
            group: ''
            removable: mupen-64-plus
            program: mupen64plus
          # The ARM64 build on ARM machines; Arch Linux has no official ARM image.
          - image: debian:stable
            family: Debian
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: ubuntu:24.04
            family: Debian
            group: Ubuntu
            removable: mypaint
            program: mypaint
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: ubuntu:22.04
            family: Debian
            group: Debian / Ubuntu
            removable: mypaint
            program: mypaint
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: fedora:latest
            family: Fedora
            group: Fedora
            removable: mupen-64-plus
            program: mupen64plus
            arch: aarch64
            runner: ubuntu-24.04-arm
          - image: opensuse/tumbleweed:latest
            family: openSUSE
            group: ''
            removable: mupen-64-plus
            program: mupen64plus
            arch: aarch64
            runner: ubuntu-24.04-arm
    container: ${{ matrix.image }}
    name: ${{ matrix.image }}${{ matrix.arch && ' on aarch64' || '' }}
    steps:
      - name: Base tools
        run: |
          case "${{ matrix.family }}" in
            Arch) pacman -Syu --noconfirm --needed sudo git python which ;;
            Debian)
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y sudo git python3 curl ca-certificates
              # The installer tests read TOML; Python before 3.11 needs tomli.
              python3 -c 'import tomllib' 2>/dev/null || apt-get install -y python3-tomli ;;
            Fedora) dnf install -y sudo git python3 which findutils ;;
            openSUSE)
              zypper --non-interactive install sudo git python3 which findutils curl tar gzip gawk
              # zypper takes answers only from a terminal; the other package
              # managers read the "yes" piped into each run below. Answer for
              # it the same way, where sudo's secure path finds it.
              mv /usr/bin/zypper /usr/bin/zypper.real
              printf '#!/bin/sh\nexec /usr/bin/zypper.real --non-interactive "$@"\n' > /usr/bin/zypper
              chmod +x /usr/bin/zypper ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.arch && 'helixforge-aarch64' || 'helixforge' }}
          path: bin
      - name: Detection
        run: |
          chmod +x bin/helixforge
          bin/helixforge system | tee system.txt
          grep -q "Package manager: .*(${{ matrix.family }} family)" system.txt
      - name: The catalog on this distribution
        run: |
          bin/helixforge list > visible.txt
          bin/helixforge list --all > all.txt
          visible=$(grep -vE '/$' visible.txt | grep -cE '^\s')
          total=$(grep -vE '/$' all.txt | grep -cE '^\s')
          echo "Visible entries: $visible of $total"
          test "$total" -ge 230
          test "$visible" -ge 100
          if [ -n "${{ matrix.group }}" ]; then
            grep -q "^    ${{ matrix.group }}/$" visible.txt
          fi
      - name: Real package installs through the engine
        run: |
          bin/helixforge plan htop
          yes | bin/helixforge run htop ripgrep --yes | tee run.txt
          command -v htop
          command -v rg
          # Verified by the package manager, not by the command on the PATH.
          grep -qE '^Verified: htop: (pacman|dpkg|dnf|zypper) lists htop' run.txt
          grep -qE '^Verified: Ripgrep: (pacman|dpkg|dnf|zypper) lists ripgrep' run.txt
          bin/helixforge plan developer-basics | tee plan.txt
          grep -qE 'Ripgrep: already installed \((pacman|dpkg|dnf|zypper) lists ripgrep\)' plan.txt
          bin/helixforge history --limit 1 | grep -q 'ok .*exit 0, verified'
          # Their status: installed, from the family's package manager, with a version.
          bin/helixforge status htop ripgrep | tee status.txt
          grep -qE '^htop +Installed +(pacman|apt|dnf|zypper) [0-9]' status.txt
          grep -qE '^Ripgrep +Installed +(pacman|apt|dnf|zypper) [0-9]' status.txt
          # The health checks run read-only on each distribution.
          bin/helixforge doctor | tee doctor.txt
          grep -qE '^(OK|Notice|Problem) +Disk space: ' doctor.txt
          grep -qE '^(OK|Notice|Problem) +Network: ' doctor.txt
          if bin/helixforge doctor --repair no-such-check --yes; then
            echo "an unknown repair ran" >&2
            exit 1
          fi
          # Freshly installed, so nothing to update; on Arch it would be the whole system.
          bin/helixforge update htop --dry-run | tee update.txt
          grep -qE '^htop: up to date \((pacman|apt|dnf|zypper) [0-9]' update.txt
      - name: More package entries every family has (git is already there)
        run: |
          yes | bin/helixforge run neovim btop --yes --keep-going | tee more.txt
          for name in Neovim btop; do
            grep -qE "^Verified: $name: " more.txt
          done
      - name: Drift sees what changed since a baseline
        run: |
          echo one > "$HOME/drift-sample.conf"
          bin/helixforge drift save "Before" --path "$HOME/drift-sample.conf"
          bin/helixforge drift list | grep -q '^before  Before '
          bin/helixforge drift check --exit-code
          echo two > "$HOME/drift-sample.conf"
          yes | bin/helixforge run fzf --yes > /dev/null
          case "${{ matrix.family }}" in
            Arch) pacman -R --noconfirm htop ;;
            Debian) apt-get remove -y htop ;;
            Fedora) dnf remove -y htop ;;
            openSUSE) zypper remove htop ;;
          esac
          status=0
          bin/helixforge drift check --exit-code > drift.txt || status=$?
          cat drift.txt
          test "$status" = 1
          grep -qE '^Missing +htop +was installed \((pacman|apt|dnf|zypper)' drift.txt
          grep -qE '^Added +fzf ' drift.txt
          grep -qE '^Changed +~/drift-sample.conf ' drift.txt
          grep -q 'helixforge run htop$' drift.txt
          bin/helixforge drift check --json > drift.json
          python3 -c 'import json; d = json.load(open("drift.json"))["data"]; assert d["restore"] == ["htop"], d; assert {"missing", "added", "file-changed"} <= {x["kind"] for x in d["differences"]}, d'
          # What restores it plans like any run, without changing anything.
          restore=$(python3 -c 'import json; print(json.load(open("drift.json"))["data"]["restore"][0])')
          bin/helixforge run "$restore" --dry-run | grep -q '^1\. htop$'
      - name: The change preview and the hardware center, read-only
        run: |
          # htop was removed by the Drift step above.
          bin/helixforge plan htop --effects | tee effects.txt
          grep -qE '✓ installs htop from (pacman|apt-get|dnf|zypper)' effects.txt
          case "${{ matrix.family }}" in
            Arch) grep -qE '✓ pacman (lists nothing else|would also install)' effects.txt ;;
            Debian) grep -qE '✓ apt (lists nothing else|would also install)' effects.txt ;;
            *) grep -q '? which dependencies' effects.txt ;;
          esac
          bin/helixforge plan htop --effects --json | python3 -c 'import json, sys; d = json.load(sys.stdin)["data"]; assert d["effects"][0]["changes"][0]["certainty"] == "known", d'
          # Containers have no GRUB, and the preview says so instead of guessing.
          bin/helixforge plan grub-dracula --effects | grep -q '/etc/default/grub: .*it is not on this machine, so this does not apply'
          bin/helixforge hardware | tee hardware.txt
          grep -q '^Firmware$' hardware.txt
          grep -q '^Disks$' hardware.txt
          bin/helixforge hardware --json | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == 1 and "disks" in d["data"], d'
          bin/helixforge hardware --smart nvme0n1 --dry-run | grep -q 'sudo smartctl --health --attributes /dev/nvme0n1'
          if bin/helixforge hardware --smart '../sda' --dry-run; then
            echo "a disk name with a path was accepted" >&2
            exit 1
          fi
      - name: The setup wizard's plans and the desktop, read-only
        run: |
          bin/helixforge setup | tee setup.txt
          grep -qE '^Packages +(pacman|APT|DNF|zypper)' setup.txt
          grep -q '^  developer ' setup.txt
          # A workstation's plan only plans: nothing is installed.
          bin/helixforge setup minimal | tee minimal.txt
          grep -q 'The plan, which nothing has run' minimal.txt
          grep -q 'To run it, after reading it: helixforge run ' minimal.txt
          bin/helixforge setup developer --json | python3 -c 'import json, sys; d = json.load(sys.stdin)["data"]; assert d["chosen"] == "developer" and any(s["id"] == "git" for s in d["suggestions"]), d'
          if bin/helixforge setup no-such-workstation; then
            echo "an unknown workstation was accepted" >&2
            exit 1
          fi
          # Containers run no desktop, and it says so.
          bin/helixforge desktop | grep -q '^Desktop   none found'
      - name: An offline bundle is made, checked and installed from
        run: |
          # htop was removed by the Drift step above. Steam, a script, needs
          # the network; there is no Steam for ARM.
          if [ -n "${{ matrix.arch }}" ]; then
            bin/helixforge bundle create /tmp/bundle htop | tee bundle.txt
          else
            bin/helixforge bundle create /tmp/bundle htop steam | tee bundle.txt
            grep -q '^Needs the network: Steam' bundle.txt
          fi
          grep -q '^Offline: htop$' bundle.txt
          (cd /tmp/bundle && sha256sum --check SHA256SUMS)
          bin/helixforge bundle verify /tmp/bundle
          # A changed file is caught before anything is installed.
          cp -a /tmp/bundle /tmp/tampered
          echo changed >> /tmp/tampered/helixforge
          if bin/helixforge bundle install /tmp/tampered --dry-run; then
            echo "a tampered bundle was accepted" >&2
            exit 1
          fi
          yes | /tmp/bundle/helixforge bundle install /tmp/bundle --yes | tee installed.txt
          command -v htop
          bin/helixforge status htop | grep -qE '^htop +Installed'
      - name: Entries for x86_64 only are left out on ARM
        if: matrix.arch
        run: |
          for id in steam google-chrome install-chaotic-aur-repository resolve-native; do
            if grep -q "^ *$id " visible.txt; then
              echo "$id, for x86_64 only, shows on ${{ matrix.image }} on aarch64" >&2
              exit 1
            fi
            grep -q "^ *$id " all.txt
          done
          # Named anyway, it is blocked before anything runs.
          bin/helixforge plan steam | grep -q '^Blocked: Steam is for x86_64 only, and this machine is aarch64$'
          if yes | bin/helixforge run steam --yes; then
            echo "Steam ran on aarch64" >&2
            exit 1
          fi
      # WINE and Steam's gaming stack are for x86 programs.
      - name: WINE and gaming packages the catalog names exist here
        if: ${{ !matrix.arch }}
        run: |
          bin/helixforge plan wine winetricks protontricks minigalaxy | tee gaming.txt
          grep -q '^[0-9]\. WINE$' gaming.txt
          case "${{ matrix.image }}" in
            archlinux:*)
              pacman -Si wine wine-staging winetricks protontricks > /dev/null
              # The CachyOS gaming lists name real Arch packages (some in multilib).
              printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
              pacman -Sy
              sed -n "s/^\(META\|APPLICATION\)_PACKAGES='\(.*\)'/\2/p" scripts/installers/commander/cachyos-gaming.sh |
                xargs pacman -Si > /dev/null ;;
            # Debian keeps winetricks and protontricks in contrib, off by default.
            debian:*) apt-cache show wine minigalaxy > /dev/null ;;
            ubuntu:*) apt-cache show wine winetricks protontricks minigalaxy > /dev/null ;;
            fedora:*) dnf info -q wine winetricks protontricks minigalaxy > /dev/null ;;
            opensuse/*)
              # Every openSUSE package the catalog names exists in the
              # distribution's repositories.
              grep -rhE '^suse = ' catalog | sed 's/^suse = "\(.*\)"$/\1/' | sort -u > suse-names.txt
              missing=0
              while read -r name; do
                if ! zypper --non-interactive --quiet search --match-exact --type package "$name" > /dev/null; then
                  echo "openSUSE has no package $name" >&2
                  missing=1
                fi
              done < suse-names.txt
              test "$missing" = 0 ;;
          esac
          # The Arch-only entries show only on Arch; Garuda's meta-package
          # nowhere here. A bare "! grep" never fails a step, so test it.
          if [ "${{ matrix.family }}" = Arch ]; then
            grep -q '^      proton-cachyos ' visible.txt
          elif grep -q 'proton-cachyos' visible.txt; then
            echo "an Arch-only entry shows on ${{ matrix.image }}" >&2
            exit 1
          fi
          if grep -q 'wine-meta' visible.txt; then
            echo "Garuda's WINE Meta shows on ${{ matrix.image }}" >&2
            exit 1
          fi
      - name: Converted package entries, removal and the AUR route
        run: |
          yes | bin/helixforge run lynx --yes
          command -v lynx
          if [ -n "${{ matrix.removable }}" ]; then
            yes | bin/helixforge run ${{ matrix.removable }} --yes
            command -v ${{ matrix.program }}
            bin/helixforge remove ${{ matrix.removable }} --dry-run | tee removal.txt
            grep -q '^1. Remove ' removal.txt
            yes | bin/helixforge remove ${{ matrix.removable }} --yes | tee removed.txt
            grep -q '^Verified: Remove .*: removed' removed.txt
            # A bare "! command" never fails a step under set -e; test it explicitly.
            # Forget the path bash remembered from the install check above, or
            # command -v reports the removed file.
            hash -r
            if command -v ${{ matrix.program }}; then
              echo "${{ matrix.program }} is still installed after removal" >&2
              exit 1
            fi
            bin/helixforge remove ${{ matrix.removable }} --dry-run | grep -q 'not installed'
          else
            # Arch takes these from the AUR, then Flathub; without paru, yay
            # or flatpak the run stops before it starts.
            bin/helixforge plan tenacity | grep -q -- '-S --needed tenacity'
            if bin/helixforge run tenacity --yes; then
              echo "the AUR route ran without paru or yay" >&2
              exit 1
            fi
            bin/helixforge remove tenacity --dry-run | grep -q 'not installed'
          fi
      - name: Falling back to the next source, and verification
        run: |
          # The distribution's own package manager is real and finds no
          # package for the fixture entries; flatpak is a stand-in, put
          # where sudo's secure path finds it.
          test ! -e /usr/bin/flatpak
          cat > /usr/bin/flatpak <<'STANDIN'
          #!/bin/sh
          case $1 in
            install) case $3 in *Missing*) ;; *) mkdir -p "/var/lib/flatpak/app/$3" ;; esac ;;
            uninstall) rm -r "/var/lib/flatpak/app/$2" ;;
          esac
          STANDIN
          chmod +x /usr/bin/flatpak
          hf() { bin/helixforge --catalog-dir tests/fixtures/packages "$@"; }
          yes | hf run fallback-sample --yes | tee fallback.txt
          grep -q '^HelixForge: .* failed (exit [0-9]*)' fallback.txt
          grep -q '^HelixForge: trying Flathub' fallback.txt
          grep -q '^Verified: Fallback Sample: org.helixforge.FallbackSample is installed from Flathub' fallback.txt
          hf plan fallback-sample | grep -q 'already installed'
          yes | hf remove fallback-sample --yes | tee removal.txt
          grep -q '^Verified: Remove Fallback Sample: removed' removal.txt
          test ! -e /var/lib/flatpak/app/org.helixforge.FallbackSample
          if yes | hf run missing-sample --yes > missing.txt; then
            echo "an install that left nothing behind was trusted" >&2
            exit 1
          fi
          grep -q '^HelixForge: Flathub finished, but Missing Sample is not installed' missing.txt
          hf history --limit 1 | grep -q 'failed | Missing Sample | exit 1'
          rm /usr/bin/flatpak
      - name: Script and native entries
        run: |
          bin/helixforge run system-report machine-summary --yes | tee report.txt
          grep -q '^==> System Report (script)' report.txt
          grep -q '^Distribution:' report.txt
      - name: A failing run is recorded as failed
        run: |
          printf 'name = "Fail"\n\n[command]\nline = "exit 7"\n' > /dev/null
          ! bin/helixforge run definitely-not-an-entry --yes
      - name: Installer tests under this distribution's shell
        run: |
          ls -l /bin/sh
          python3 -B -m unittest discover -s tests/installers -t tests/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.arch && 'packages-aarch64' || 'packages' }}
          path: packages
      - name: The native package installs, works and removes cleanly
        run: |
          ls -l packages
          # The packages for this machine's architecture.
          case "${{ matrix.arch }}" in
            aarch64) arch=aarch64 debian=arm64 ;;
            *) arch=x86_64 debian=amd64 ;;
          esac
          case "${{ matrix.family }}" in
            Arch)
              pacman -U --noconfirm packages/helixforge-*-$arch.pkg.tar.zst
              pacman -Ql helixforge > files.txt ;;
            Debian)
              apt-get install -y ./packages/helixforge_*_$debian.deb
              dpkg -L helixforge > files.txt ;;
            Fedora)
              dnf install -y ./packages/helixforge-*.$arch.rpm
              rpm -ql helixforge > files.txt ;;
            openSUSE)
              # nfpm's packages are not signed with a key zypper knows.
              zypper --non-interactive install --allow-unsigned-rpm ./packages/helixforge-*.$arch.rpm
              rpm -ql helixforge > files.txt ;;
          esac
          # Arch and Fedora link /usr/sbin to /usr/bin, which comes first on PATH.
          test "$(readlink -f "$(command -v helixforge)")" = /usr/bin/helixforge
          helixforge --version | grep -qE '^helixforge [0-9]+\.[0-9]+\.[0-9]+$'
          helixforge list --json | python3 -c 'import json, sys; assert json.load(sys.stdin)["schema"] == 1'
          helixforge system | grep -q "(${{ matrix.family }} family)"
          helixforge report --no-checks | tee report.txt
          grep -q '^- Installed from: package$' report.txt
          # The images leave out manual pages and documentation, so these are
          # checked in the package's own file list.
          for file in /usr/bin/helixforge /usr/share/man/man1/helixforge.1.gz \
              /usr/share/bash-completion/completions/helixforge \
              /usr/share/zsh/site-functions/_helixforge \
              /usr/share/fish/vendor_completions.d/helixforge.fish \
              /usr/share/applications/helixforge.desktop \
              /usr/share/icons/hicolor/512x512/apps/helixforge.png; do
            grep -qE "^(helixforge )?$file\$" files.txt
          done
          test -f /usr/share/bash-completion/completions/helixforge
          test -f /usr/share/applications/helixforge.desktop
          case "${{ matrix.family }}" in
            Arch) pacman -R --noconfirm helixforge ;;
            Debian) apt-get remove -y helixforge ;;
            Fedora) dnf remove -y helixforge ;;
            openSUSE) zypper --non-interactive remove helixforge ;;
          esac
          hash -r
          test ! -e /usr/bin/helixforge
          test ! -e /usr/share/applications/helixforge.desktop
      - name: Record what HelixForge verified in this container
        run: |
          bin/helixforge history --json --limit 1000 > history.json
          python3 -B scripts/validation-record.py record "${{ matrix.image }}${{ matrix.arch && ' on aarch64' || '' }}" history.json catalog \
            > "validation-${{ strategy.job-index }}.json"
          cat "validation-${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ strategy.job-index }}
          path: validation-${{ strategy.job-index }}.json

  # The boot, login-screen, disk and kernel entries for real, in virtual
  # machines: each is run, rebooted into and checked (scripts/vm-tests.py).
  # Cloud images on BIOS and UEFI firmware (the GRUB themes in a machine of
  # their own), the Arch live ISO for the installer, and an Arch machine
  # whose firmware says it is a Steam Deck. The Arch and openSUSE machines
  # also install offline bundles with no network.
  # The screens captured while they boot are kept for a person to look at.
  vm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, arch-themes, debian, fedora, opensuse, arch-uefi, arch-iso, steamdeck]
    name: vm ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helixforge
          path: bin
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf genisoimage python3-pil
          ls -l /dev/kvm
      - name: The entries, run and rebooted into
        run: |
          chmod +x bin/helixforge
          python3 -B scripts/vm-tests.py --distro "${{ matrix.distro }}" --binary bin/helixforge \
            --work "$RUNNER_TEMP/vm" --out "validation-vm-${{ matrix.distro }}.json" --shots screens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vm-screens-${{ matrix.distro }}
          path: screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-vm-${{ matrix.distro }}
          path: validation-vm-${{ matrix.distro }}.json

  # One record of every container's and virtual machine's results, which
  # release builds carry for the reliability screen
  # (scripts/validation-record.py).
  record:
    needs: [distribution, vm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-*
          path: parts
          merge-multiple: true
      - name: Merge the containers' records
        run: |
          python3 -B scripts/validation-record.py merge validation.json "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" parts/*.json
          python3 -c 'import json; d = json.load(open("validation.json")); assert len(d["images"]) == 11, d; assert all(i["entries"].get("htop") == "verified" for i in d["images"].values()), d; assert sorted(d["vms"]) == ["arch", "arch-iso", "arch-themes", "arch-uefi", "debian", "fedora", "opensuse", "steamdeck"], d'
          cat validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation
          path: validation.json
