name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The dependencies as main last built them; only what changed compiles.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install shellcheck and fish
        run: scripts/ci-apt-install.sh shellcheck fish
      - name: Workflow lint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The tests as a release build runs them, with a Distributions record
        run: |
          printf '%s\n' '{"format": 1, "commit": "0000000000000000000000000000000000000000", "run": 1, "url": "https://example.invalid", "finished": 1792175066, "images": {"archlinux:latest": {"entries": {"htop": "verified", "system-report": "ran"}}}, "vms": {"arch": {"entries": {"grub-dracula": "verified", "sddm": "verified", "apparmor": "verified", "plymouth-on": "verified", "plymouth-theme": "verified", "plymouth-dotfiles": "verified", "enable-ssd-trim": "verified", "bootable-usb-creator": "verified"}}, "arch-iso": {"entries": {"arch-server-setup": "verified"}}, "arch-themes": {"entries": {"grub-tela": "verified", "grub": "verified"}}, "arch-uefi": {"entries": {"limine-cachyos": "verified", "limine-garuda": "verified"}}, "fedora": {"entries": {"selinux": "verified"}}, "steamdeck": {"entries": {"linux-neptune-for-steamdeck": "verified"}}}}' \
            > catalog/validation-results.json
          # The catalog is embedded at build time; build it again with the record.
          touch crates/helix-toolbox-catalog/src/lib.rs
          cargo test --workspace
          rm catalog/validation-results.json
          touch crates/helix-toolbox-catalog/src/lib.rs
      - name: The crates package and build as crates.io would
        run: cargo package --workspace --allow-dirty
      - name: Installer tests
        run: python3 -B -m unittest discover -s tests/installers -v
      - name: Shellcheck
        run: |
          shellcheck -x -P . scripts/shared/*.sh scripts/installers/*.sh scripts/installers/commander/*.sh \
              tests/fixtures/scripts/shared/*.sh tests/fixtures/scripts/installers/*.sh start.sh \
              scripts/package.sh scripts/package-gui.sh scripts/install-nfpm.sh scripts/icons.sh scripts/gui-smoke.sh
          find scripts/installers -name '*.sh' -not -path '*/commander/*' -print0 | xargs -0 shellcheck -x -P . -S error
      - name: Catalog matches the dotfiles and Myfish exports
        run: |
          python3 -B scripts/sync-sources.py --render
          git diff --exit-code -- catalog scripts/installers/commander
      - run: cargo build --release -p helix-toolbox
      - run: target/release/helix-toolbox --version
      - name: Walkthrough is current
        run: |
          target/release/helix-toolbox docgen docs/walkthrough.md
          git diff --exit-code -- docs/walkthrough.md

  # The graphical interface: its own workspace, which needs WebKitGTK and
  # the built frontend.
  gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/helix-toolbox-gui/src-tauri -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/helix-toolbox-gui/package-lock.json
      - name: Install WebKitGTK and the other libraries Tauri needs
        run: scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: The frontend type-checks and builds
        working-directory: apps/helix-toolbox-gui
        run: |
          npm ci --no-fund --no-audit
          npm run check
          npm run build
      # With the smoke test's feature throughout, so the tests and its build
      # share one compiled Tauri rather than building it twice.
      - name: The window's crate
        working-directory: apps/helix-toolbox-gui/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features tauri/custom-protocol -- -D warnings
          cargo test --locked --features tauri/custom-protocol
      # The window opened on a virtual display and driven through the setup
      # wizard, the palette, every screen, a run and a saved profile against
      # the fixture catalog (scripts/gui-smoke.sh), a debug build with the
      # built frontend in it.
      - name: The window's smoke test
        run: |
          (cd apps/helix-toolbox-gui/src-tauri && cargo build --locked --features tauri/custom-protocol)
          xvfb-run -a scripts/gui-smoke.sh apps/helix-toolbox-gui/src-tauri/target/debug/helix-toolbox-gui
