name: Something went wrong
description: An entry failed, the menu misbehaved, or HelixForge did something unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing HelixForge. `helixforge report` prints most of what is needed below; read it before you paste it.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Name the entry or screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open Applications › Developer Tools
        2. Press Space on Neovim, then Enter on the Install Plan
        3. …
  - type: textarea
    id: output
    attributes:
      label: What the run printed
      description: From the running window (l saves a log; History lists the saved logs) or the terminal. Leave out anything private.
      render: text
  - type: textarea
    id: report
    attributes:
      label: helixforge report
      description: The output of `helixforge report`.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: How you run HelixForge
      options:
        - A package from the releases (pacman, apt, dnf or zypper)
        - start.sh
        - Built from source
        - Something else
    validations:
      required: true
